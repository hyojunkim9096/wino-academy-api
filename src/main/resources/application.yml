# =====================================================================
# application.yml (공통 기본 설정)
# =====================================================================
# 🔑 필요 ENV:
#   REGION_API_URL, REGION_API_KEY, DB_* (Datasource),
#   MAIL_*, SCHOOLINFO_API_KEY
# =====================================================================

server:
  port: 8080
  tomcat:
    max-swallow-size: 2MB

spring:
  profiles:
    default: dev
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      adjust-dates-to-context-time-zone: false
    time-zone: Asia/Seoul
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
      file-size-threshold: 1MB
  sql:
    init:
      mode: never
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# ───────────────── OpenAPI(Swagger UI) ─────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha
    tags-sorter: alpha
    enabled: true

mybatis:
  mapper-locations: classpath*:mappers/**/*.xml
  type-aliases-package: com.wino.academyapi.domain
  configuration:
    map-underscore-to-camel-case: true

logging:
  level: { }

session:
  minutes: 60

app:
  jwt:
    secret-key: ${JWT_SECRET_KEY:MySuperSecretKeyIsExactly32Byte!}
    expiration-ms: 3600000
  crypto:
    aes-key: ${AES_SECRET_KEY:0123456789ABCDEF0123456789ABCDEF}
  mail:
    from: ${MAIL_FROM:WINO Support <noreply@localhost>}

  # 지오코딩은 전역 OFF (잔존 코드 가드)
  geo:
    geocoding:
      enabled: false

  external:
    # 학교알리미(SCHOOLINFO) 연동
    school:
      schoolinfo:
        enabled: true
        url: https://www.schoolinfo.go.kr/openApi.do
        api-key: ${SCHOOLINFO_API_KEY:}
        page-size: 1000
        throttle-ms: 400
        timeout:
          connect-ms: 5000
          read-ms: 30000
        http:
          max-total: 50
          max-per-route: 10

  region:
    sync:
      enabled: true
      api-url: ${REGION_API_URL:}
      api-key: ${REGION_API_KEY:}
      replace-all-on-refresh: true
      auto-disable-missing: true
      batch-size: 1000
      http-max-total: 50
      http-max-per-route: 10
      http-connect-timeout-ms: 7000
      http-read-timeout-ms: 30000
      schedule-enabled: false
      schedule-cron: "0 30 3 * * *"
      schedule-zone: "Asia/Seoul"

  school:
    sync:
      provider: SCHOOLINFO
      schedule-enabled: false
      schedule-cron: "0 0 4 * * *"
      schedule-zone: "Asia/Seoul"
      enrich-after: false
      hard-stop-seconds: 3600