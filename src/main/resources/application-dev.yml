spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/wino_db?useSSL=false&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      idle-timeout: 300000      # 5분
      max-lifetime: 1800000     # 30분
      connection-timeout: 30000 # 30초
      initialization-fail-timeout: -1  # ❗️풀 초기화 실패해도 부팅 계속(FAIL-FAST 끔)

  jpa:
    # ❗️부팅 시 DB에 붙지 않고도 EMF 생성 가능하도록 고정
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none            # ❗️부팅 시 스키마 검증/작업 안 함(연결 불필요)
    properties:
      hibernate:
        highlight_sql: true
        boot:
          allow_jdbc_metadata_access: false  # ❗️JDBC 메타데이터 조회 금지(부트 타임 접속 방지)
        jdbc:
          time_zone: Asia/Seoul

  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://127.0.0.1:5173

storage:
  attach:
    base-path: ${ATTACH_BASE_PATH:"D:\\projects\\attach_file"}
