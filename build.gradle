/*
 * Gradle 빌드 스크립트 — 전체 주석본
 *
 * 핵심 수정
 *  1) ✅ MySQL 드라이버 scope: runtimeOnly → implementation
 *     - IDE에서 Application 런(run) 시에도 드라이버가 항상 클래스패스에 올라오도록 안전하게 변경
 *  2) ✅ testRuntimeOnly에도 드라이버 유지 (통합테스트시 필요할 수 있음)
 *  3) springdoc, httpclient5 등은 기존 유지
 */

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.wino'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
    // toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
}

dependencies {
    // ───────────────────── Spring Boot 스타터(핵심) ─────────────────────
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // ─────────────────────────── OpenAPI(Swagger UI) ───────────────────
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // ─────────────────────────── DB 드라이버 ────────────────────────────
    implementation 'com.mysql:mysql-connector-j'   // ✅ 드라이버
    testRuntimeOnly 'com.mysql:mysql-connector-j'  // (테스트 런타임)

    // (권장) 테스트 DB(H2) — test 프로필에서 메모리 DB로 빠르게/안정적으로 구동
    testImplementation 'com.h2database:h2'

    // ─────────────────────────── HTTP 클라이언트 ─────────────────────────
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    // ───────────────────────────── JWT ────────────────────────────────
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // ─────────────────────────── MyBatis(선택) ──────────────────────────
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'

    // ───────────────────────────── Lombok ──────────────────────────────
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // yml 자동완성/메타데이터 생성(@ConfigurationProperties)
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ───────────────────────────── Test ────────────────────────────────
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
    // systemProperty "spring.profiles.active", (System.getProperty("spring.profiles.active") ?: "test")
}

bootRun {
    // gradle bootRun -Pprofile=prod 처럼 프로필 전환 가능
    systemProperty "spring.profiles.active", (project.findProperty("profile") ?: "dev")
}